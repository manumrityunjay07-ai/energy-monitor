name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.html'
      - '**.css'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.html'
      - '**.css'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node dashboard_contract_test.mjs
